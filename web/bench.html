<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmark · 明辨 MINGBIAN</title>
<script>
(function () {
  var b = location.pathname.replace(/(report|trace|graph)\/[^/]*$/, '')
    .replace(/(dashboard|experts|ledger|bench|about)\/?$/, '');
  if (b.slice(-1) !== '/') b += '/';
  document.write('<base href="' + b + '">');
})();
</script>
<link rel="icon" href="./static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./static/mb.css">
</head>
<body>
<header id="topbar"></header>
<div class="wrap-wide" style="padding-top:24px">
  <div class="page-head" style="padding-top:0">
    <h1>Case Benchmark</h1>
    <p>单个 demo 跑得漂亮说明不了什么，可能只是碰巧。所以我们固定了 10 道研判题，
      每次改动都重跑一遍，记录覆盖率、无证据结论占比、一次过检率与耗时——
      用数字证明这一版比上一版好。</p>
  </div>

  <div class="grid grid-4" id="top"></div>

  <section class="mt28">
    <div class="row-between mb12"><h2 class="fs20">迭代曲线</h2>
      <span class="t4 fs12" id="curveNote"></span></div>
    <div class="card"><div id="curve"></div></div>
  </section>

  <section class="mt28">
    <div class="row-between mb12"><h2 class="fs20">版本逐项对比</h2>
      <span class="t4 fs12">同一套题、同一套口径，只有版本变了</span></div>
    <div class="card">
      <div style="overflow-x:auto"><table class="tbl" id="verTbl">
        <thead><tr><th>指标</th></tr></thead><tbody></tbody>
      </table></div>
      <div class="t4 fs11 mt12" id="verNote"></div>
    </div>
  </section>

  <section class="mt28">
    <div class="row-between mb12"><h2 class="fs20">题集</h2>
      <span class="t4 fs12">点「跑一次」会用当前版本重新研判，结果写回曲线</span></div>
    <div class="grid grid-2" id="cases"></div>
  </section>
</div>
<footer id="footer"></footer>

<script src="./static/mb-core.js"></script>
<script>
(function () {
  const { $, esc, getJSON, pct, fmtTime } = MB;
  MB.mountTopbar('Benchmark');
  MB.mountFooter();

  getJSON('./api/bench').then(d => {
    const curve = d.curve || [], cases = d.cases || [], latest = d.latest || {};

    const last = curve[curve.length - 1] || {};
    $('#top').innerHTML = [
      ['累计跑题', d.total_runs || 0, `覆盖 ${Object.keys(latest).length} / ${cases.length} 道`],
      ['平均独立来源', last.avg_domains != null ? last.avg_domains : '—', '最新版本'],
      ['无证据结论占比', last.unsupported_ratio != null ? pct(last.unsupported_ratio) : '—', '越低越好'],
      ['一次过检率', last.first_pass_rate != null ? pct(last.first_pass_rate) : '—', '不需返工的比例'],
    ].map(([k, v, dsc]) =>
      `<div class="card"><div class="stat"><span class="v">${esc(String(v))}</span>` +
      `<span class="k">${esc(k)}</span><span class="d">${esc(dsc)}</span></div></div>`).join('');

    if (!curve.length) {
      $('#curve').innerHTML = `<div class="empty">还没有 Benchmark 记录。` +
        `跑几道题（下方点「跑一次」），这里就会画出版本曲线。</div>`;
    } else {
      $('#curveNote').textContent = `${curve.length} 个版本 · ${d.total_runs} 次运行`;
      $('#curve').innerHTML = spark(curve);
    }

    renderVersions(curve);

    $('#cases').innerHTML = cases.map(c => {
      const l = latest[c.id];
      return `<div class="card"><div class="row-between mb8">` +
        `<span class="tag tag-accent">${esc(c.domain)}</span>` +
        `<a class="btn btn-sm" href="./?q=${encodeURIComponent(c.q)}&mode=deep">跑一次 →</a></div>` +
        `<div class="t1 fs14" style="line-height:1.6">${esc(c.q)}</div>` +
        `<div class="t4 fs12 mt8">难点：${esc(c.hard)}</div>` +
        (l ? `<div class="inset mt12 fs12 t3">` +
          `<div class="row wrapflex" style="gap:12px">` +
          `<span>证据 <b class="mono t2">${l.evidence_count}</b></span>` +
          `<span>独立源 <b class="mono t2">${l.independent_domains}</b></span>` +
          `<span>无证据占比 <b class="mono t2">${pct(l.unsupported_ratio)}</b></span>` +
          `<span>返工 <b class="mono t2">${l.rework_rounds}</b> 轮</span>` +
          `<span>${(l.elapsed_ms / 1000).toFixed(1)}s</span></div>` +
          (l.report_id ? `<a class="fs11 mt4" style="display:inline-block" href="./report/${esc(l.report_id)}">看这次的报告 →</a>` : '') +
          `</div>`
          : `<div class="t4 fs12 mt12">这道题还没跑过。</div>`) +
        `</div>`;
    }).join('');
  }).catch(() => {
    $('#curve').innerHTML = '<div class="empty">读取失败。</div>';
  });

  /* 版本对比表。better 决定箭头的颜色方向：耗时和无证据占比是越低越好 */
  const ROWS = [
    ['runs', '运行次数', v => v, null, '这一版一共跑了多少次题'],
    ['cases', '覆盖题数', v => (v || []).length + ' / 10', 'up', '十道固定题里跑过几道'],
    ['avg_domains', '平均独立来源', v => v, 'up', '按主域归一后的独立来源数，越多越难被单一信源带偏'],
    ['bound_ratio', '论点绑证据率', v => Math.round(v * 100) + '%', 'up', '有多少论点真的挂上了证据'],
    ['unsupported_ratio', '无证据结论占比', v => Math.round(v * 100) + '%', 'down', '越低越好'],
    ['avg_credibility', '平均来源可信度', v => v, 'up', '纯规则打分，满分 100'],
    ['first_pass_rate', '一次过检率', v => Math.round(v * 100) + '%', 'up', '不需要返工就通过质检的比例'],
    ['avg_tensions', '平均未解张力', v => v, null, '不追求高低——它衡量的是敢不敢把分歧摆出来'],
    ['avg_gaps', '平均诚实缺口', v => v, null, '主动写明「这个我没查到」的条数'],
    ['debate_open_rate', '辩论开启率', v => Math.round((v || 0) * 100) + '%', null,
      '门控判定存在真实分歧的比例。不是越高越好，一边倒的题本就不该辩'],
    ['avg_seconds', '平均耗时', v => v + 's', 'down', '含取证、返工与辩论的端到端时间'],
  ];

  function renderVersions(curve) {
    const tbl = $('#verTbl');
    if (!curve.length) { tbl.closest('.card').innerHTML = '<div class="empty">还没有版本数据。</div>'; return; }
    tbl.querySelector('thead').innerHTML = '<tr><th>指标</th>' +
      curve.map(c => `<th class="num">${esc(c.version)}</th>`).join('') +
      (curve.length > 1 ? '<th class="num">变化</th>' : '') + '</tr>';
    tbl.querySelector('tbody').innerHTML = ROWS.map(([key, name, fmt, better, why]) => {
      const cells = curve.map(c => `<td class="num mono t2">${esc(String(fmt(c[key])))}</td>`).join('');
      let delta = '';
      if (curve.length > 1 && better) {
        const a = curve[0][key], b = curve[curve.length - 1][key];
        const va = Array.isArray(a) ? a.length : Number(a || 0);
        const vb = Array.isArray(b) ? b.length : Number(b || 0);
        const diff = vb - va;
        const good = better === 'up' ? diff > 0 : diff < 0;
        const cls = diff === 0 ? 't4' : (good ? 'strength-strong' : 'strength-weak');
        const shown = /率|占比/.test(name) ? Math.round(diff * 100) + '%' : Math.round(diff * 10) / 10;
        delta = `<td class="num mono ${cls}">${diff > 0 ? '+' : ''}${shown}</td>`;
      } else if (curve.length > 1) {
        delta = `<td class="num t4">—</td>`;
      }
      return `<tr><td><b class="t2">${esc(name)}</b>` +
        `<div class="t4 fs11 mt4">${esc(why)}</div></td>${cells}${delta}</tr>`;
    }).join('');
    $('#verNote').textContent = curve.length > 1
      ? `“变化”一列是最新版本相对第一个版本的差值。绿色代表朝好的方向走，` +
        `没有标注方向的指标（张力、缺口、辩论开启率）不做好坏判断——它们衡量的是诚实度，不是分数。`
      : `目前只有 ${curve[0].version} 一个版本的数据。再跑一版才能比出高下。`;
  }

  /* 用纯 SVG 画多序列折线，不引外部图表库 */
  function spark(curve) {
    const series = [
      { key: 'avg_domains', label: '平均独立来源', color: '#5b9cf8', scale: 12 },
      { key: 'bound_ratio', label: '论点绑证据率', color: '#47b881', scale: 1 },
      { key: 'unsupported_ratio', label: '无证据结论占比', color: '#e0645f', scale: 1 },
      { key: 'first_pass_rate', label: '一次过检率', color: '#a583f0', scale: 1 },
    ];
    const W = 900, H = 240, P = 34;
    const n = curve.length;
    const x = i => P + (n === 1 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (n - 1));
    const y = v => H - P - Math.max(0, Math.min(1, v)) * (H - 2 * P);

    const grid = [0, .25, .5, .75, 1].map(g =>
      `<line x1="${P}" y1="${y(g)}" x2="${W - P}" y2="${y(g)}" stroke="#1e2128" stroke-width="1"/>` +
      `<text x="${P - 8}" y="${y(g) + 4}" text-anchor="end" fill="rgba(233,237,243,.45)" font-size="10">${Math.round(g * 100)}</text>`
    ).join('');

    const paths = series.map(s => {
      const pts = curve.map((c, i) => `${x(i)},${y((c[s.key] || 0) / s.scale)}`);
      const dots = curve.map((c, i) =>
        `<circle cx="${x(i)}" cy="${y((c[s.key] || 0) / s.scale)}" r="3" fill="${s.color}"/>`).join('');
      return `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="1.8"/>` + dots;
    }).join('');

    const labels = curve.map((c, i) =>
      `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" fill="rgba(233,237,243,.45)" font-size="10">${esc(c.version)}</text>`
    ).join('');

    const legend = series.map(s =>
      `<span class="t4 fs11"><span style="color:${s.color}">●</span> ${s.label}` +
      (s.scale !== 1 ? `（÷${s.scale}）` : '') + `</span>`).join('');

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">${grid}${paths}${labels}</svg>` +
      `<div class="row wrapflex mt8" style="gap:16px">${legend}</div>`;
  }
})();
</script>
</body>
</html>
