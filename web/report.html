<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研判报告 · 明辨 MINGBIAN</title>
<script>
(function () {
  var b = location.pathname
    .replace(/(report|trace|graph)\/[^/]*$/, '')
    .replace(/(dashboard|experts|ledger|bench|about)\/?$/, '');
  if (b.slice(-1) !== '/') b += '/';
  document.write('<base href="' + b + '">');
})();
</script>
<link rel="icon" href="./static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./static/mb.css">
</head>
<body>
<header id="topbar"></header>
<div class="wrap-wide" style="padding-top:24px">
  <div class="row-between mb16 wrapflex">
    <div class="grow">
      <div class="t4 fs11">研判报告</div>
      <div class="fs20 t1" id="qText">加载中…</div>
      <div class="row wrapflex mt8" style="gap:7px" id="metaRow"></div>
    </div>
    <div class="row" style="gap:7px">
      <a class="btn btn-sm" id="linkTrace" href="#">决策回放</a>
      <a class="btn btn-sm" id="linkGraph" href="#">实体工作区</a>
      <button class="btn btn-sm" id="btnCopy">复制链接</button>
      <a class="btn btn-sm btn-primary" href="./">提个新问题</a>
    </div>
  </div>
  <div id="host">
    <div class="card"><div class="skel w60"></div><div class="skel w80"></div><div class="skel w40"></div></div>
  </div>
</div>
<footer id="footer"></footer>

<script src="./static/mb-core.js"></script>
<script src="./static/mb-report.js"></script>
<script>
(function () {
  const { $, esc, getJSON, toast, copy, fmtDur, fmtTime } = MB;
  MB.mountTopbar('研判台');
  MB.mountFooter();

  const rid = location.pathname.split('/').filter(Boolean).pop();
  document.getElementById('btnCopy').addEventListener('click', () => copy(location.href));
  $('#linkTrace').href = './trace/' + rid;
  $('#linkGraph').href = './graph/' + rid;

  Promise.all([
    getJSON('./api/report/' + rid),
    getJSON('./api/reviews/' + rid).catch(() => ({ reviews: {} })),
  ]).then(([r, rv]) => {
    document.title = (r.question || '研判报告') + ' · 明辨';
    $('#qText').textContent = r.question || '（无题）';
    $('#metaRow').innerHTML =
      `<span class="tag">${esc(fmtTime(r.created_at))}</span>` +
      (r.model ? `<span class="tag tag-accent mono">${esc(r.model)}</span>` : '') +
      (r.taskId ? `<span class="tag mono" title="可在 InfiniSynapse 后台查验">taskId ${esc(r.taskId.slice(0, 14))}</span>` : '') +
      (r.elapsed_ms ? `<span class="tag">${esc(fmtDur(r.elapsed_ms))}</span>` : '') +
      (r.share_url ? `<a class="tag tag-ok" href="${esc(r.share_url)}" target="_blank" rel="noopener">平台公开链接 ↗</a>` : '');
    MBReport.render($('#host'), r, { reviews: rv.reviews || {} });
  }).catch(e => {
    $('#host').innerHTML = `<div class="empty">没找到这份报告。它可能已被清理，` +
      `<a href="./">回到研判台</a>重新提问。</div>`;
    $('#qText').textContent = '报告不存在';
  });
})();
</script>
</body>
</html>
